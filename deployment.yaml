apiVersion: apps/v2
kind: Deployment
metadata:
  name: python-game-deployment
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: python-game
  template:
    metadata:
      labels:
        app: python-game
    spec:
      imagePullSecrets:
      - name: regcred
      containers:
      - name: python-game
        image: devop93/gameapplication:v1  # <--- Ungaloda actual Docker image name & tag-ah inga podunga
        ports:
        - containerPort: 3001                         # <--- Ungaloda application run aagura port-ah podunga
