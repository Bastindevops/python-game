apiVersion: v1
kind: Service
metadata:
  name: python-game-service
  namespace: default
spec:
  type: ClusterIP  # Can be ClusterIP, NodePort, or LoadBalancer based on your exposure needs
  selector:
    app: python-game
  ports:
  - protocol: TCP
    port: 80         # The port the service exposes inside the cluster
    targetPort: 3001 # The port your python-game container is actually listening on
